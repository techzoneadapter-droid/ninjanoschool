# Self-hosted database only. The Java game process runs with run.bat / scripts/start-server.sh.
# Requires a private .env with strong NSO_DB_ROOT_PASSWORD and NSO_MYSQL_PASSWORD values.
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${NSO_DB_ROOT_PASSWORD:?Set NSO_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: nsohuyda_data
      MARIADB_USER: nso
      MARIADB_PASSWORD: ${NSO_MYSQL_PASSWORD:?Set NSO_MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NSO_MYSQL_PORT:-3306}:3306"
    volumes:
      - nso_database:/var/lib/mysql
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent -h 127.0.0.1 --user=root --password=\"$MARIADB_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nso_database:
