name: Verify NSO Java server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Apache Ant
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ant
      - name: Check local scripts and safe defaults
        run: |
          bash -n scripts/start-server.sh
          test -f .env.example
          test -f compose.yaml
          ! grep -Eqi 'nsohuydat\\.online|Huydat123' ninja.conf
          grep -q '127.0.0.1' ninja.conf
      - name: Compile the backend from source
        run: ant -noinput clean jar
      - name: Verify jar entry point
        run: |
          test -f dist/NSO-HUYDAT.jar
          unzip -p dist/NSO-HUYDAT.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: huydat.server.Server'
      - name: Verify safe refusal without DB password
        run: |
          set +e
          output=$(timeout 15s java -jar dist/NSO-HUYDAT.jar 2>&1)
          code=$?
          set -e
          echo "$output" | grep -q "Set NSO_MYSQL_PASSWORD"
          test "$code" -ne 0
          test "$code" -ne 124
      - name: Validate Docker Compose configuration
        env:
          NSO_DB_ROOT_PASSWORD: ci-test-only-not-secret
          NSO_MYSQL_PASSWORD: ci-test-only-not-secret
        run: docker compose -f compose.yaml config --quiet
      - name: Inspect dump schemas without exposing account data
        run: python3 scripts/analyze_sql.py 'database-sql/nsohuyda_account (1).sql' 'database-sql/nsohuyda_data (1).sql'
